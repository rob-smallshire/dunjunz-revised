[project]
name = "dunjunz-revised"
version = "2026.5"
description = "Dunjunz Revised -- Julian Avis's 1986 four-player dungeon game for the BBC Micro, fixed and made filing-system agnostic"
requires-python = ">=3.12"
dependencies = [
    "oaknut-dfs>=12.18.2",
    "oaknut-adfs>=13.6.1",      # the ADFS disc
    "jinja2>=3.1.6",
]

[project.scripts]
dr-build = "dunjunz_revised.build:main"
dr-sizes = "dunjunz_revised.sizes:main"
dr-machines = "dunjunz_revised.machines:main"
dr-sprites = "dunjunz_revised.sprite_sheet:main"
dr-frame-time = "dunjunz_revised.frame_time:main"
dr-title-gif = "dunjunz_revised.title_animation:main"
dr-readme = "dunjunz_revised.generate_readme:main"
dr-banner = "dunjunz_revised.key_page_banner:main"

[dependency-groups]
test = [
    # 0.20.1 or later: 0.19.0 and 0.20.0 read an unplugged analogue channel as
    # &8000, which the 1987 game's coder_start takes for a joystick, so its
    # Barbarian's keys and SPACE were read from the stick. 0.20.1's
    # beebium-server wheels need glibc 2.41, so CI runs on ubuntu-26.04.
    "beebium[imaging]>=0.20.1",
    "beebium-server>=0.20.1",
    "py65>=1.2",
    "pytest>=8",
    "pytest-timeout>=2",
    "oaknut-disc>=13.6.1",
    "oaknut-afs>=13.6.1",
]
dev = [
    { include-group = "test" },
    # Only to remake the title's key-page banner (dr-banner), which is checked in.
    "sextants>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/dunjunz_revised"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600

# Resolve from public PyPI, whatever the machine's default index, so that
# uv.lock records public URLs and CI can install from it.
[[tool.uv.index]]
url = "https://pypi.org/simple"

# Single source of truth for the version, managed by bump-my-version. The
# version is YEAR.N: every release bumps N (there is no patch part).
#
#   uvx bump-my-version bump minor      # 2026.1 -> 2026.2, edits files, commit + tag
#   uvx bump-my-version bump major      # new year: 2026.5 -> 2027.0; then bump minor
#
# Validate first with:
#   uvx bump-my-version bump --dry-run --verbose minor

[tool.bumpversion]
current_version = "2026.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)"
serialize = ["{major}.{minor}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
allow_dirty = false
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
message = "Release v{new_version}"
# Rebuild before committing, so that the README's pictures of the title
# screen (docs/title-screen.png and .gif) show the new version.
pre_commit_hooks = [
    "uv run dr-build",
    "uv run dr-title-gif",
    "git add README.md docs/title-screen.png docs/title-screen.gif",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# The version the build puts on the disc title, !BOOT and the title screen.
[[tool.bumpversion.files]]
filename = "tools/dunjunz_revised/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = 'name = "dunjunz-revised"\nversion = "{current_version}"'
replace = 'name = "dunjunz-revised"\nversion = "{new_version}"'
