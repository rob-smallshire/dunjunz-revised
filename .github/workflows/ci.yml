name: CI

# Build the discs and run the whole test suite -- the reassembly checks and
# the game in the Beebium emulator, compared with the 1987 release, and under
# each filing system (not yet over Econet: see below) -- on every push to
# master and every pull request. release.yml reuses this workflow before
# publishing.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  BEEBASM_VERSION: v1.10

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04          # glibc 2.39: the beebium-server manylinux_2_36 wheel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # beebasm is not packaged; build it from source once and cache it.
      - name: Cache beebasm
        id: beebasm-cache
        uses: actions/cache@v6
        with:
          path: ~/beebasm/bin
          key: beebasm-${{ env.BEEBASM_VERSION }}-${{ runner.os }}

      - name: Build beebasm
        if: steps.beebasm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$BEEBASM_VERSION" https://github.com/stardot/beebasm.git ~/beebasm/src
          make -C ~/beebasm/src/src code
          mkdir -p ~/beebasm/bin
          cp "$(find ~/beebasm/src -maxdepth 2 -type f -name beebasm -perm -u+x | head -1)" ~/beebasm/bin/

      - name: Put beebasm on the PATH
        run: |
          echo "$HOME/beebasm/bin" >> "$GITHUB_PATH"
          test -x "$HOME/beebasm/bin/beebasm"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      # The default groups include the tests': Beebium's client and its
      # headless server wheel, which brings the BBC Micro ROMs and presets,
      # and oaknut-disc, which builds the file server's disc.
      - name: Install
        run: uv sync --locked

      - name: Build the discs
        run: uv run dr-build

      # The Econet tests (a Level 3 File Server and a client station on AUN)
      # pass locally but not yet on GitHub's runners, so they are left out
      # here for now; run them locally before a release.
      - name: Run the tests
        run: uv run pytest -q --ignore=tests/test_network.py

      # The disc images, named for the version: DFS and ADFS.
      - name: Keep the disc images
        uses: actions/upload-artifact@v7
        with:
          name: discs
          path: |
            build/dunjunz-revised-v*.ssd
            build/dunjunz-revised-v*.adl
          if-no-files-found: error
