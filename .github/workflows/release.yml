name: Release

# Triggered by a version tag (v2026.2, ...), which `uvx bump-my-version bump
# minor` makes (see pyproject.toml). Runs the whole test suite first; only if
# it passes does it build the discs and publish a GitHub release with both
# images, DFS and ADFS, named for the version (build/ already names them
# dunjunz-revised-v<version>, and the tag is v<version>).

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BEEBASM_VERSION: v1.10
    steps:
      - uses: actions/checkout@v6

      - name: Cache beebasm
        id: beebasm-cache
        uses: actions/cache@v6
        with:
          path: ~/beebasm/bin
          key: beebasm-${{ env.BEEBASM_VERSION }}-${{ runner.os }}

      - name: Build beebasm
        if: steps.beebasm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$BEEBASM_VERSION" https://github.com/stardot/beebasm.git ~/beebasm/src
          make -C ~/beebasm/src/src code
          mkdir -p ~/beebasm/bin
          cp "$(find ~/beebasm/src -maxdepth 2 -type f -name beebasm -perm -u+x | head -1)" ~/beebasm/bin/

      - name: Put beebasm on the PATH
        run: echo "$HOME/beebasm/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --locked --no-default-groups

      - name: Check the tag matches the version
        run: |
          version="$(uv run python -c 'from dunjunz_revised._version import __version__; print(__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version ${version}" >&2
            exit 1
          fi

      - name: Build the discs
        run: |
          uv run dr-build
          test -f "build/dunjunz-revised-${GITHUB_REF_NAME}.ssd"
          test -f "build/dunjunz-revised-${GITHUB_REF_NAME}.adl"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/dunjunz-revised-${GITHUB_REF_NAME}.ssd" \
            "build/dunjunz-revised-${GITHUB_REF_NAME}.adl" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Dunjunz Revised ${GITHUB_REF_NAME}" \
            --notes "Dunjunz Revised for the BBC Micro (or an emulator of one), on two disc images: an 80-track DFS disc (.ssd) for any BBC Micro, and an ADFS L disc (.adl) for a Master or a Master Compact. Insert one and press Shift-Break to boot. The files can also be copied to any filing system, including a Level 3 File Server, and run with *RUN DUNJUNZ. *TYPE README on either disc shows the version, how to play, and the copyright notice."
